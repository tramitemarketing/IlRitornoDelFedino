# Configurazione deploy per Netlify.
# Su Vercel non serve nulla: rileva Astro in automatico (build: "astro build", output: "dist").

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Header di sicurezza/performance di base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
